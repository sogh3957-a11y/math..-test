<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عملیات روی مجموعه‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1 class="title-single-line">عملیات روی مجموعه‌ها</h1>

  <!-- مجموعه‌ها (سمت چپ) -->
  <div class="sets-section">
    <div class="set-row">
      <label>مجموعه A:</label>
      <input type="text" class="set-input" id="setA" placeholder="اعداد را با نقطه وارد کنید">
    </div>

    <div class="set-row">
      <label>مجموعه B:</label>
      <input type="text" class="set-input" id="setB" placeholder="اعداد را با نقطه وارد کنید">
    </div>

    <div id="extraSetsContainer">
      <div id="extraSets"></div>
      <button id="addSetBtn" class="add-btn">+</button>
    </div>
  </div>

  <!-- عملیات و کادرهای جواب (سمت راست) -->
  <div class="ops-section">
    <div class="op-block">
      <input type="text" class="answer-input" id="unionAnswer" placeholder="جواب اجتماع">
      <button class="op-btn" id="unionBtn">اجتماع</button>
    </div>

    <div class="op-block">
      <input type="text" class="answer-input" id="interAnswer" placeholder="جواب اشتراک">
      <button class="op-btn" id="interBtn">اشتراک</button>
    </div>

    <div class="op-block">
      <input type="text" class="answer-input" id="diffAnswer" placeholder="جواب تفاضل">
      <button class="op-btn" id="diffBtn">تفاضل</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
