<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عملیات روی مجموعه‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">عملیات روی مجموعه‌ها</h1>

<div class="main-layout">

  <!-- ستون چپ: مجموعه‌ها -->
  <div class="left-panel">

    <div class="set-row">
      <label>مجموعه A:</label>
      <input type="text" class="set-input" id="setA" placeholder="اعداد را با نقطه وارد کنید">
    </div>

    <div class="set-row">
      <label>مجموعه B:</label>
      <input type="text" class="set-input" id="setB" placeholder="اعداد را با نقطه وارد کنید">
    </div>

    <div id="extraSets"></div>

    <button id="addSetBtn" class="add-btn">+</button>

  </div>

  <!-- ستون راست: عملیات و جواب -->
  <div class="right-panel">

    <input type="text" id="answerBox" class="answer-box"
           placeholder="جواب را وارد کنید و Enter بزنید">

    <div class="ops">
      <button class="op-btn" data-op="union">اجتماع</button>
      <button class="op-btn" data-op="intersect">اشتراک</button>
      <button class="op-btn" data-op="diff">تفاضل</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
