<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عملیات روی مجموعه‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>عملیات روی مجموعه‌ها</h1>

<div class="layout">

  <!-- سمت چپ: مجموعه‌ها -->
  <div class="sets-box">
    <div class="set-row">
      <label>مجموعه A:</label>
      <input class="set-input">
    </div>

    <div class="set-row">
      <label>مجموعه B:</label>
      <input class="set-input">
    </div>

    <div id="extraSets"></div>
    <button id="addSetBtn" class="add-btn">+</button>
  </div>

  <!-- سمت راست: عملیات -->
  <div class="ops-box">

    <div class="op-block" data-op="union">
      <h3>اجتماع</h3>
      <input class="answer-input">
      <button>نمایش جواب</button>
    </div>

    <div class="op-block" data-op="intersect">
      <h3>اشتراک</h3>
      <input class="answer-input">
      <button>نمایش جواب</button>
    </div>

    <div class="op-block" data-op="diff">
      <h3>تفاضل</h3>
      <input class="answer-input">
      <button>نمایش جواب</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
