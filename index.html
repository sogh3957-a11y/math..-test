<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اضافه کردن مجموعه‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>اضافه کردن مجموعه‌ها</h1>

  <div class="input-section">
    <input type="text" id="setInput" placeholder="نام مجموعه را وارد کنید">
    <button id="addButton">+</button>
  </div>

  <div class="result" id="setList">
    <!-- مجموعه‌ها اینجا اضافه می‌شوند -->
  </div>

  <div class="alert" id="alertMsg"></div>
</div>

<script src="script.js"></script>
</body>
</html>
